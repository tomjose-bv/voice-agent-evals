[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent-evals"
version = "0.1.0"
description = "A local customer-service voice agent and an evaluation harness that scores it before it talks to real callers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Tom Jose" }]
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "truststore>=0.9",
]

[project.optional-dependencies]
voice = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "numpy>=1.26",
  "faster-whisper>=1.0",
  "pyttsx3>=2.90",
]
piper = ["piper-tts>=1.2"]
dev = ["pytest>=8.0", "fastapi>=0.110", "uvicorn>=0.29", "numpy>=1.26", "httpx>=0.27"]

[project.scripts]
vae = "voice_agent_evals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_agent_evals = ["voice/static/*", "scenarios_builtin/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
